name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r transformada_de_laplace/requirements.txt pytest
      - run: python -m pytest -q
      - name: Check the web viewer's JavaScript
        run: node --check docs/app.js
